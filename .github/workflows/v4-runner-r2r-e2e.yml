name: v4 runner ReadyToRun e2e
on:
  push:
    branches: [v4-test/runner-r2r-e2e]
  workflow_dispatch:
jobs:
  boot:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        variant: [test, r2r]
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.arch }}-${{ matrix.variant }}-${{ matrix.rep }}/env=v4dev/runner=2cpu-linux-${{ matrix.arch }}/image=ubuntu26-full-${{ matrix.arch }}${{ matrix.variant == 'test' && (matrix.arch == 'arm64' && '/ami=ami-0fb58bb151e7d2a45' || '/ami=ami-097cc9a11e7419235') || (matrix.arch == 'arm64' && '/ami=ami-08c209d9ea6b5e8eb' || '/ami=ami-027ecbc282c7d77a6') }}
    steps:
      - name: Boot profile
        run: |
          cat /home/runner/.runs-on-r2r 2>/dev/null || echo 'not ReadyToRun'
          systemd-analyze || true
          echo "== critical chain to sandboxd"
          systemd-analyze critical-chain runs-on-sandboxd.service || true
          echo "== rolaunch"
          sudo journalctl -b -u rolaunch -o short-monotonic --no-pager | grep -vE "^\s*$" | cut -c1-200 | grep -E "Starting|resize|grown|growpart|prefetch|executing|processed|Finished" || true
          echo "== sandboxd unit"
          sudo journalctl -u runs-on-sandboxd -o short-monotonic --no-pager | head -3 | cut -c1-200 || true
          sudo cat /var/lib/rolaunch/timings.json 2>/dev/null | head -c 2000 || true
