name: v4 hosts

on:
  workflow_dispatch:
  push:
    branches: [v4-test/hosts]
    paths:
      - .github/workflows/v4-hosts.yml

jobs:
  linux-ec2:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    runs-on: runs-on/fleet=v4-dev-hosts-ec2/env=dev
    steps:
      - uses: actions/checkout@v4
      - name: Where am I
        run: |
          echo "runner: $RUNNER_NAME on $RUNS_ON_INSTANCE_ID ($RUNS_ON_INSTANCE_TYPE)"
          uname -a
          cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max || true
          sudo apt-get --version | head -1
  windows:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    runs-on: runs-on/fleet=v4-dev-hosts-win/env=dev
    steps:
      - uses: actions/checkout@v4
      - name: Where am I
        run: |
          "runner: $env:RUNNER_NAME on $env:RUNS_ON_INSTANCE_ID ($env:RUNS_ON_INSTANCE_TYPE)"
          [Environment]::OSVersion
          Get-ChildItem
          git --version
