name: v4 discovery
on:
  push:
    branches: [v4-test/discovery]
jobs:
  first:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=2cpu-linux-x64
    steps:
      - run: echo "first on $RUNS_ON_INSTANCE_ID"; sleep 20
  second:
    needs: first
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=2cpu-linux-x64
    steps:
      - run: echo "second on $RUNS_ON_INSTANCE_ID"
