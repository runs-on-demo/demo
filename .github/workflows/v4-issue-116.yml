name: v4 issue 116 apparmor stacking
# runner-images-for-aws#116: applies the image fix (the sysctl file
# runner-user.sh will write) on a live runner, the way systemd-sysctl applies
# it at boot, then runs the assertion script.
on:
  push:
    branches: ['v4-test/issue-116-apparmor']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ubuntu26-full-x64, arch: x64 }
          - { image: ubuntu26-full-arm64, arch: arm64 }
          - { image: ubuntu24-full-x64, arch: x64 }
          - { image: ubuntu22-full-x64, arch: x64 }
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.image }}/env=v4dev/runner=2cpu-linux-${{ matrix.arch }}/image=${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Before the fix
        run: bash scripts/issue-116-assert.sh || true
      - name: Apply the sysctl file as the image will
        run: |
          sudo tee /etc/sysctl.d/20-apparmor.conf >/dev/null <<'EOT'
          # https://github.com/runs-on/runner-images-for-aws/issues/116
          -kernel.apparmor_restrict_unprivileged_unconfined = 0
          EOT
          sudo systemctl restart systemd-sysctl.service
          systemctl status systemd-sysctl.service --no-pager | tail -5
          sudo journalctl -u systemd-sysctl.service --no-pager | tail -5
          sysctl kernel.apparmor_restrict_unprivileged_unconfined kernel.apparmor_restrict_unprivileged_userns
      - name: After the fix
        run: bash scripts/issue-116-assert.sh
