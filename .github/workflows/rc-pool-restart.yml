name: RC verify / pool job queued during a restart

# #730: a pool= job queued while the server restarts waits for the pool
# definitions to load, then runs on the pool. The server is stopped while this
# run is queued and started again. rc370-crohr is a temporary empty pool for
# the demo stack in runs-on-demo/.github-private.
on:
  push:
    branches-ignore: [master]
    paths: [rc-verify/v370/pool-restart.txt]

permissions:
  contents: read

jobs:
  pool-job:
    runs-on: runs-on=${{ github.run_id }}/pool=rc370-crohr/env=demo
    timeout-minutes: 20
    steps:
      - run: echo "ran on $RUNS_ON_INSTANCE_ID"
