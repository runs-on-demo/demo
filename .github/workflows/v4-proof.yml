# v4 proof of the security hardening (monorepo 3576fc0) and the sticky late bind, on runs-on-v4-dev.
# Every job collects its PROOF lines in an output; the report job prints them all.
name: v4 proof

on:
  push:
    branches: ['v4-test/proof*']

jobs:
  flex:
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/env=dev/extras=s3-cache+git-cache+apt-cache
    outputs:
      lines: ${{ steps.proof.outputs.lines }}
    steps:
      - uses: actions/checkout@v4
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: blob
          key: v4-proof-flex-${{ github.ref_name }}
      - run: |
          echo "PROOF on $RUNS_ON_INSTANCE_TYPE $RUNS_ON_RUNNER_NAME; cache hit: ${{ steps.restore.outputs.cache-hit }}; restored from run $(cat blob/run 2>/dev/null || echo none)" | tee -a /tmp/proof
          mkdir -p blob && head -c 20000000 /dev/urandom > blob/data && echo "${{ github.run_id }}" > blob/run
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: blob
          key: v4-proof-flex-${{ github.ref_name }}
      - run: |
          git clone -q https://github.com/runs-on/action /tmp/action && git -C /tmp/action log -1 --format=%h
          echo "PROOF git-cache $(curl -s http://127.0.0.1:6871/_runs-on/git-cache | head -c 300)" | tee -a /tmp/proof
          sudo apt-get update -q | tail -2
          sudo apt-get install -y -q --reinstall jq | tail -1
          echo "PROOF apt-cache $(curl -s http://127.0.0.1:6871/_runs-on/apt-cache/stats | head -c 300)" | tee -a /tmp/proof
      - name: the license host answers the controller's request
        run: |
          body='{"org":"runs-on-demo","region":"us-east-1","license_key":"proof-not-a-key","app_version":"v4-proof"}'
          for u in https://licensing.runs-on.com/validate https://runs-on.com/api/licenses/validate; do
            echo "PROOF license $u: $(curl -sS --max-time 10 -o /tmp/out -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' -d "$body" "$u") $(head -c 300 /tmp/out)" | tee -a /tmp/proof
          done
      - &proof
        id: proof
        if: always()
        run: |
          { echo "lines<<PROOF_EOF"; cat /tmp/proof 2>/dev/null || echo "no proof lines"; echo PROOF_EOF; } >> "$GITHUB_OUTPUT"
  pool:
    runs-on: runs-on/fleet=v4-dev/env=dev
    outputs:
      lines: ${{ steps.proof.outputs.lines }}
    steps:
      - run: echo "PROOF pool job on $RUNS_ON_INSTANCE_TYPE ($RUNS_ON_INSTANCE_LIFECYCLE) $RUNS_ON_RUNNER_NAME" | tee -a /tmp/proof
      - *proof
  # Both must fail fast, with an error naming runs-on/fleet=v4-dev/env=dev.
  refused-pool:
    runs-on: runs-on/pool=v4-dev/env=dev
    steps:
      - run: echo "BUG a pool= job ran"
  refused-pool-run-id:
    runs-on: runs-on=${{ github.run_id }}/pool=v4-dev/env=dev
    steps:
      - run: echo "BUG a pool= job ran"
  sticky-flex:
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/env=dev/sticky=proof:10gb
    outputs:
      lines: ${{ steps.proof.outputs.lines }}
    steps: &sticky
      - run: |
          d=/mnt/runs-on/stickydisk
          # As runs-on/action does: the disk follows the job's start.
          for i in $(seq 300); do [ -e /runs-on/stickydisk.ready ] || [ -e /runs-on/stickydisk.unavailable ] && break; sleep 1; done
          n=$(sudo cat "$d/count" 2>/dev/null || echo 0)
          echo "PROOF sticky perms: umask $(umask), me $(id -un), dir $(stat -c '%U:%G %a' "$d"), files $(sudo ls -l "$d" | awk 'NR>1 {print $1 "/" $3 "/" $9}' | tr '\n' ' ')" | tee -a /tmp/proof
          echo "PROOF sticky on $RUNS_ON_RUNNER_NAME: waited ${i}s, markers $(ls /runs-on/ | grep -i sticky | tr '\n' ' '), unavailable: $(cat /runs-on/stickydisk.unavailable 2>/dev/null | head -c 200), mounted: $(mountpoint -q "$d" && echo yes || echo no), previous count $n, ref ${GITHUB_REF}" | tee -a /tmp/proof
          echo $((n+1)) | sudo tee "$d/count" >/dev/null
          echo "run ${GITHUB_RUN_NUMBER} job ${GITHUB_JOB} on $(hostname)" | sudo tee -a "$d/history" >/dev/null
          echo "PROOF sticky history: $(sudo tail -4 "$d/history" | tr '\n' ';')" | tee -a /tmp/proof
          touch "$d/as-me-$GITHUB_RUN_NUMBER" && echo "PROOF sticky: the job's user writes there, mode $(stat -c %a "$d/as-me-$GITHUB_RUN_NUMBER")" | tee -a /tmp/proof || echo "PROOF sticky: the job's user cannot write there" | tee -a /tmp/proof
          sleep 5
      - *proof
  sticky-pool:
    runs-on: runs-on/fleet=v4-dev-sticky/env=dev
    outputs:
      lines: ${{ steps.proof.outputs.lines }}
    steps: *sticky
  guest-a:
    runs-on: runs-on/fleet=v4-dev-hosts-kvm/env=dev
    outputs:
      lines: ${{ steps.proof.outputs.lines }}
    steps: &guest
      - run: |
          echo "PROOF guest $RUNS_ON_RUNNER_NAME type ${RUNS_ON_INSTANCE_TYPE:-none} kernel $(uname -r) addr $(ip -4 -o addr show scope global | awk '{print $2 "=" $4}' | tr '\n' ' ') gw $(ip route | awk '/default/ {print $3}')" | tee -a /tmp/proof
          echo "PROOF out: $(curl -4 -sS --max-time 15 https://checkip.amazonaws.com); dns: $(getent hosts github.com | head -1); resolvers: $(grep nameserver /etc/resolv.conf | tr '\n' ' ')" | tee -a /tmp/proof
          echo "PROOF umask $(umask); systemd $(systemctl is-system-running 2>&1 | head -1); docker $(docker info -f '{{.ServerVersion}}' 2>&1 | head -1 | cut -c1-60); virt $(systemd-detect-virt 2>&1 | head -1)" | tee -a /tmp/proof
          curl -sf --max-time 3 http://169.254.169.254/ >/dev/null && echo "PROOF mmds without token: open" | tee -a /tmp/proof || echo "PROOF mmds without token: refused" | tee -a /tmp/proof
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: blob
          key: v4-proof-${{ github.job }}-${{ github.ref_name }}
      - run: |
          echo "PROOF cache hit: ${{ steps.restore.outputs.cache-hit }}; restored from run $(cat blob/run 2>/dev/null || echo none)" | tee -a /tmp/proof
          mkdir -p blob && head -c 20000000 /dev/urandom > blob/data && echo "${{ github.run_id }}" > blob/run
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: blob
          key: v4-proof-${{ github.job }}-${{ github.ref_name }}
      - run: |
          git clone -q https://github.com/runs-on/action /tmp/action && git -C /tmp/action log -1 --format=%h
          echo "PROOF git-cache $(curl -s http://127.0.0.1:6871/_runs-on/git-cache | head -c 300)" | tee -a /tmp/proof
          sudo apt-get update -q | tail -1
          sudo apt-get install -y -q --reinstall jq | tail -1
          echo "PROOF apt-cache $(curl -s http://127.0.0.1:6871/_runs-on/apt-cache/stats | head -c 300)" | tee -a /tmp/proof
      - name: siblings and the host must not answer
        run: |
          me=$(ip -4 -o addr show scope global | awk '{print $4}' | cut -d/ -f1 | head -1)
          sleep 25 # the other guest job boots meanwhile
          probe() { ip=$1; ping -c1 -W2 "$ip" >/dev/null 2>&1 && echo "$ip(ping)"; timeout 2 bash -c "echo > /dev/tcp/$ip/22" 2>/dev/null && echo "$ip(tcp22)"; timeout 2 bash -c "echo > /dev/tcp/$ip/6871" 2>/dev/null && echo "$ip(tcp6871)"; true; }
          export -f probe
          # A guest is 172.16.<n>.2 and its host's tap 172.16.<n>.1 (n from 1).
          open=$(for n in $(seq 1 16); do echo 172.16.$n.1; echo 172.16.$n.2; done | grep -vx "$me" | xargs -P 64 -I{} bash -c 'probe {}' | sort -V | tr '\n' ' ')
          echo "PROOF answering among 172.16.1-16.{1,2} besides me ($me): ${open:-none}" | tee -a /tmp/proof
          for t in 10.1.0.2:53 10.1.0.1:22 169.254.169.253:53 169.254.169.254:80; do
            timeout 2 bash -c "echo > /dev/tcp/${t%:*}/${t#*:}" 2>/dev/null && echo "PROOF $t open" | tee -a /tmp/proof || echo "PROOF $t closed" | tee -a /tmp/proof
          done
      - *proof
  guest-b:
    runs-on: runs-on/fleet=v4-dev-hosts-kvm/env=dev
    outputs:
      lines: ${{ steps.proof.outputs.lines }}
    steps: *guest
  nitro-a:
    runs-on: runs-on/fleet=v4-proof-nitro/env=dev
    outputs:
      lines: ${{ steps.proof.outputs.lines }}
    steps: *guest
  nitro-b:
    runs-on: runs-on/fleet=v4-proof-nitro/env=dev
    outputs:
      lines: ${{ steps.proof.outputs.lines }}
    steps: *guest
  nitro-c:
    runs-on: runs-on/fleet=v4-proof-nitro/env=dev
    outputs:
      lines: ${{ steps.proof.outputs.lines }}
    steps: *guest
  report:
    needs: [flex, pool, refused-pool, refused-pool-run-id, sticky-flex, sticky-pool, guest-a, guest-b, nitro-a, nitro-b, nitro-c]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "== \(.key): \(.value.result)\n\(.value.outputs.lines // "")"'
