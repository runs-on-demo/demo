name: v4 stress

# Burst and soak waves for the v4 dev stack (runs-on-v4-dev). One push is one
# wave; the commit message says how many jobs of each kind and for how long:
#   [flex=200] [flexod=20] [pool=50] [microvm=100] [nitro=12] [sleep=60]
# A kind left out runs nothing. Up to 512 jobs of a kind per wave (two
# matrices of 256, GitHub's limit). Driven and measured by
# deploy/v4/stress.sh in runs-on/monorepo (release/v4).
on:
  push:
    branches: [v4-test/stress]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sleep: ${{ steps.m.outputs.sleep }}
      flex_a: ${{ steps.m.outputs.flex_a }}
      flex_b: ${{ steps.m.outputs.flex_b }}
      flexod_a: ${{ steps.m.outputs.flexod_a }}
      flexod_b: ${{ steps.m.outputs.flexod_b }}
      pool_a: ${{ steps.m.outputs.pool_a }}
      pool_b: ${{ steps.m.outputs.pool_b }}
      microvm_a: ${{ steps.m.outputs.microvm_a }}
      microvm_b: ${{ steps.m.outputs.microvm_b }}
      nitro_a: ${{ steps.m.outputs.nitro_a }}
      nitro_b: ${{ steps.m.outputs.nitro_b }}
    steps:
      - id: m
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          num() { grep -oP "\\[$1=\\K[0-9]+" <<<"$MSG" | head -1 || true; }
          list() { if [ "$1" -gt 0 ]; then seq -s, 1 "$1" | sed 's/^/[/;s/$/]/'; else echo '[]'; fi; }
          s=$(num sleep); echo "sleep=${s:-60}" >> "$GITHUB_OUTPUT"
          for k in flex flexod pool microvm nitro; do
            n=$(num $k); n=${n:-0}; [ "$n" -gt 512 ] && n=512
            a=$(( n > 256 ? 256 : n )); b=$(( n - a ))
            echo "${k}_a=$(list $a)" >> "$GITHUB_OUTPUT"
            echo "${k}_b=$(list $b)" >> "$GITHUB_OUTPUT"
            echo "$k: $n"
          done
  flex_a:
    # Flex job on EC2 (spot, arm64, default image)
    needs: plan
    if: needs.plan.outputs.flex_a != '[]'
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.flex_a) }}
    runs-on: runs-on=${{ github.run_id }}/env=dev/family=c7g+m7g+c8g+m8g+r7g+r8g/cpu=2/image=ubuntu26-full-arm64
    timeout-minutes: 60
    steps:
      - run: |
          echo "STRESS flex ${{ matrix.n }} on ${RUNS_ON_INSTANCE_ID:-$(hostname)} ${RUNS_ON_INSTANCE_TYPE:-?} $(uname -m), up $(cut -d' ' -f1 /proc/uptime)s"
          test -w "$GITHUB_WORKSPACE" && df -h "$GITHUB_WORKSPACE" | tail -1
          sleep ${{ needs.plan.outputs.sleep }}
          echo "STRESS done at $(date -u +%T)"
  flex_b:
    # Flex job on EC2 (spot, arm64, default image)
    needs: plan
    if: needs.plan.outputs.flex_b != '[]'
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.flex_b) }}
    runs-on: runs-on=${{ github.run_id }}/env=dev/family=c7g+m7g+c8g+m8g+r7g+r8g/cpu=2/image=ubuntu26-full-arm64
    timeout-minutes: 60
    steps:
      - run: |
          echo "STRESS flex ${{ matrix.n }} on ${RUNS_ON_INSTANCE_ID:-$(hostname)} ${RUNS_ON_INSTANCE_TYPE:-?} $(uname -m), up $(cut -d' ' -f1 /proc/uptime)s"
          test -w "$GITHUB_WORKSPACE" && df -h "$GITHUB_WORKSPACE" | tail -1
          sleep ${{ needs.plan.outputs.sleep }}
          echo "STRESS done at $(date -u +%T)"
  flexod_a:
    # Flex job on EC2 (on-demand, x64)
    needs: plan
    if: needs.plan.outputs.flexod_a != '[]'
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.flexod_a) }}
    runs-on: runs-on=${{ github.run_id }}/env=dev/family=c7i+m7i+c7a+m7a/cpu=2/spot=false
    timeout-minutes: 60
    steps:
      - run: |
          echo "STRESS flexod ${{ matrix.n }} on ${RUNS_ON_INSTANCE_ID:-$(hostname)} ${RUNS_ON_INSTANCE_TYPE:-?} $(uname -m), up $(cut -d' ' -f1 /proc/uptime)s"
          test -w "$GITHUB_WORKSPACE" && df -h "$GITHUB_WORKSPACE" | tail -1
          sleep ${{ needs.plan.outputs.sleep }}
          echo "STRESS done at $(date -u +%T)"
  flexod_b:
    # Flex job on EC2 (on-demand, x64)
    needs: plan
    if: needs.plan.outputs.flexod_b != '[]'
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.flexod_b) }}
    runs-on: runs-on=${{ github.run_id }}/env=dev/family=c7i+m7i+c7a+m7a/cpu=2/spot=false
    timeout-minutes: 60
    steps:
      - run: |
          echo "STRESS flexod ${{ matrix.n }} on ${RUNS_ON_INSTANCE_ID:-$(hostname)} ${RUNS_ON_INSTANCE_TYPE:-?} $(uname -m), up $(cut -d' ' -f1 /proc/uptime)s"
          test -w "$GITHUB_WORKSPACE" && df -h "$GITHUB_WORKSPACE" | tail -1
          sleep ${{ needs.plan.outputs.sleep }}
          echo "STRESS done at $(date -u +%T)"
  pool_a:
    # Fleet pool job (scale set, warm pool)
    needs: plan
    if: needs.plan.outputs.pool_a != '[]'
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.pool_a) }}
    runs-on: runs-on/fleet=v4-dev-warm/env=dev
    timeout-minutes: 60
    steps:
      - run: |
          echo "STRESS pool ${{ matrix.n }} on ${RUNS_ON_INSTANCE_ID:-$(hostname)} ${RUNS_ON_INSTANCE_TYPE:-?} $(uname -m), up $(cut -d' ' -f1 /proc/uptime)s"
          test -w "$GITHUB_WORKSPACE" && df -h "$GITHUB_WORKSPACE" | tail -1
          sleep ${{ needs.plan.outputs.sleep }}
          echo "STRESS done at $(date -u +%T)"
  pool_b:
    # Fleet pool job (scale set, warm pool)
    needs: plan
    if: needs.plan.outputs.pool_b != '[]'
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.pool_b) }}
    runs-on: runs-on/fleet=v4-dev-warm/env=dev
    timeout-minutes: 60
    steps:
      - run: |
          echo "STRESS pool ${{ matrix.n }} on ${RUNS_ON_INSTANCE_ID:-$(hostname)} ${RUNS_ON_INSTANCE_TYPE:-?} $(uname -m), up $(cut -d' ' -f1 /proc/uptime)s"
          test -w "$GITHUB_WORKSPACE" && df -h "$GITHUB_WORKSPACE" | tail -1
          sleep ${{ needs.plan.outputs.sleep }}
          echo "STRESS done at $(date -u +%T)"
  microvm_a:
    # Flex job on a Lambda MicroVM
    needs: plan
    if: needs.plan.outputs.microvm_a != '[]'
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.microvm_a) }}
    runs-on: runs-on=${{ github.run_id }}/env=dev/family=microvm
    timeout-minutes: 60
    steps:
      - run: |
          echo "STRESS microvm ${{ matrix.n }} on ${RUNS_ON_INSTANCE_ID:-$(hostname)} ${RUNS_ON_INSTANCE_TYPE:-?} $(uname -m), up $(cut -d' ' -f1 /proc/uptime)s"
          test -w "$GITHUB_WORKSPACE" && df -h "$GITHUB_WORKSPACE" | tail -1
          sleep ${{ needs.plan.outputs.sleep }}
          echo "STRESS done at $(date -u +%T)"
  microvm_b:
    # Flex job on a Lambda MicroVM
    needs: plan
    if: needs.plan.outputs.microvm_b != '[]'
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.microvm_b) }}
    runs-on: runs-on=${{ github.run_id }}/env=dev/family=microvm
    timeout-minutes: 60
    steps:
      - run: |
          echo "STRESS microvm ${{ matrix.n }} on ${RUNS_ON_INSTANCE_ID:-$(hostname)} ${RUNS_ON_INSTANCE_TYPE:-?} $(uname -m), up $(cut -d' ' -f1 /proc/uptime)s"
          test -w "$GITHUB_WORKSPACE" && df -h "$GITHUB_WORKSPACE" | tail -1
          sleep ${{ needs.plan.outputs.sleep }}
          echo "STRESS done at $(date -u +%T)"
  nitro_a:
    # Host pool job (Nitro sandbox on an autoscaled host)
    needs: plan
    if: needs.plan.outputs.nitro_a != '[]'
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.nitro_a) }}
    runs-on: runs-on/fleet=nitro-asg/env=dev
    timeout-minutes: 60
    steps:
      - run: |
          echo "STRESS nitro ${{ matrix.n }} on ${RUNS_ON_INSTANCE_ID:-$(hostname)} ${RUNS_ON_INSTANCE_TYPE:-?} $(uname -m), up $(cut -d' ' -f1 /proc/uptime)s"
          test -w "$GITHUB_WORKSPACE" && df -h "$GITHUB_WORKSPACE" | tail -1
          sleep ${{ needs.plan.outputs.sleep }}
          echo "STRESS done at $(date -u +%T)"
  nitro_b:
    # Host pool job (Nitro sandbox on an autoscaled host)
    needs: plan
    if: needs.plan.outputs.nitro_b != '[]'
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.nitro_b) }}
    runs-on: runs-on/fleet=nitro-asg/env=dev
    timeout-minutes: 60
    steps:
      - run: |
          echo "STRESS nitro ${{ matrix.n }} on ${RUNS_ON_INSTANCE_ID:-$(hostname)} ${RUNS_ON_INSTANCE_TYPE:-?} $(uname -m), up $(cut -d' ' -f1 /proc/uptime)s"
          test -w "$GITHUB_WORKSPACE" && df -h "$GITHUB_WORKSPACE" | tail -1
          sleep ${{ needs.plan.outputs.sleep }}
          echo "STRESS done at $(date -u +%T)"
  report:
    # Pick-up time of the wave's jobs, as GitHub saw it: started_at - created_at.
    needs: [flex_a, flex_b, flexod_a, flexod_b, pool_a, pool_b, microvm_a, microvm_b, nitro_a, nitro_b]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | [.name, .conclusion, .created_at, .started_at, .completed_at, (.runner_name // "")] | @tsv' > jobs.tsv
          python3 - <<'PY'
          import collections, json
          from datetime import datetime
          t = lambda s: datetime.strptime(s, "%Y-%m-%dT%H:%M:%SZ")
          kinds = collections.defaultdict(list); concl = collections.Counter()
          for line in open("jobs.tsv"):
              name, c, created, started, done, runner = line.rstrip("\n").split("\t")
              kind = name.split("_")[0]
              if kind in ("plan", "report") or not started: continue
              concl[(kind, c)] += 1
              kinds[kind].append(int((t(started) - t(created)).total_seconds()))
          for kind, xs in kinds.items():
              xs.sort(); n = len(xs)
              p = lambda q: xs[min(n - 1, int(q * (n - 1) + 0.5))]
              print("PICKUP", json.dumps({"kind": kind, "n": n, "p50": p(.5), "p90": p(.9), "p99": p(.99), "max": xs[-1],
                    "hist": dict(sorted(collections.Counter(xs).items())), "conclusions": {c: v for (k, c), v in concl.items() if k == kind}}))
          PY
      - env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # The wave's jobs, on a branch of their own for whoever measures.
          mkdir out && cd out && git init -q -b "stress-results/$GITHUB_RUN_ID"
          cp ../jobs.tsv . && printf '%s\n' "$MSG" > wave.txt
          git add -A && git -c user.name=stress -c user.email=stress@runs-on.com commit -q -m "wave $GITHUB_RUN_ID"
          git push -q "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "stress-results/$GITHUB_RUN_ID"
