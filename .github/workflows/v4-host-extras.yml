# A host pool's runner: preinstall, prerun and the cache extras on host guests.
name: v4 host extras

on:
  push:
    branches: ['v4-test/host-extras*']

jobs:
  guest:
    strategy:
      fail-fast: false
      matrix:
        pool: [hx-kvm, hx-docker, hx-nitro]
    runs-on: runs-on/fleet=${{ matrix.pool }}/env=dev
    steps:
      - name: setup (preinstall, prerun, shape)
        run: |
          echo "instance $RUNS_ON_INSTANCE_ID type $RUNS_ON_INSTANCE_TYPE pool ${RUNS_ON_POOL_NAME:-unset}; $(nproc) vCPU, $(free -m | awk '/Mem:/{print $2}') MiB"
          echo "preinstall marker: $(cat /runs-on/preinstall-marker 2>/dev/null || echo MISSING)"
          echo "prerun env: ${HX_PRERUN:-MISSING}"
          test -f /runs-on/preinstall-marker && test "$HX_PRERUN" = ran
      - name: s3-cache env
        run: env | grep -E '^ACTIONS_CACHE_URL|^ACTIONS_RESULTS_URL|^RUNS_ON_MAGIC_CACHE_URL' | sed 's/=.*/=set/' | sort; test -n "$RUNS_ON_MAGIC_CACHE_URL"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: blob
          key: hx-${{ matrix.pool }}-${{ github.ref_name }}
      - run: |
          echo "cache hit: ${{ steps.restore.outputs.cache-hit }}"
          if [ -f blob/data ]; then echo "restored blob of run $(cat blob/run)"; fi
          mkdir -p blob && head -c 20000000 /dev/urandom > blob/data && echo "${{ github.run_id }}" > blob/run
      - uses: actions/cache/save@v4
        with:
          path: blob
          key: hx-${{ matrix.pool }}-${{ github.ref_name }}-${{ github.run_id }}
      - name: second key, restored in this job (s3-cache round trip)
        uses: actions/cache/restore@v4
        id: again
        with:
          path: blob2
          key: hx-${{ matrix.pool }}-${{ github.ref_name }}-${{ github.run_id }}
          fail-on-cache-miss: false
      - uses: actions/checkout@v4
      - name: git-cache and apt-cache
        run: |
          git config --system --get-all include.path || echo "no git include"
          time git clone -q https://github.com/runs-on/action /tmp/action && git -C /tmp/action log -1 --format=%h
          echo "git-cache: $(curl -s http://127.0.0.1:6871/_runs-on/git-cache | head -c 500)"
          time sudo apt-get update -q | tail -2
          time sudo apt-get install -y -q --reinstall jq | tail -2
          echo "apt-cache: $(curl -s http://127.0.0.1:6871/_runs-on/apt-cache | head -c 500)"
      - name: ecr-cache
        run: |
          echo "ECR cache: ${RUNS_ON_ECR_CACHE:-unset}"
          test -n "$RUNS_ON_ECR_CACHE"
          printf 'FROM public.ecr.aws/docker/library/alpine:3.20\nRUN echo hx-${{ matrix.pool }} > /pool && sleep 2\n' > Dockerfile.hx
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build -f Dockerfile.hx --cache-from type=registry,ref=$RUNS_ON_ECR_CACHE:hx-${{ matrix.pool }} --cache-to type=registry,ref=$RUNS_ON_ECR_CACHE:hx-${{ matrix.pool }},mode=max,image-manifest=true,oci-mediatypes=true -t local/test . 2>&1 | grep -iE "cache|exporting|CACHED|error|denied" | head -20
      - name: sandboxd log
        if: always()
        run: sudo journalctl -u runs-on-sandboxd -o cat 2>/dev/null | grep -iE 'extra|cache|broker|denied' | cut -c1-260 | tail -20 || true
