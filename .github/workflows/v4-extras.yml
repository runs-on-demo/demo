name: v4 extras

on:
  push:
    branches: ['v4-test/extras*']

jobs:
  cache:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4cache
    steps:
      - run: env | grep -E '^ACTIONS_CACHE_URL|^ACTIONS_RESULTS_URL|^RUNS_ON_MAGIC_CACHE_URL|^RUNS_ON_S3_BUCKET_CACHE' | sed 's/=.*/=set/' | sort
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: blob
          key: v4-magic-${{ github.ref_name }}
      - run: |
          echo "cache hit: ${{ steps.restore.outputs.cache-hit }}"
          if [ -f blob/data ]; then echo "restored $(cat blob/run)"; sha256sum blob/data; fi
          mkdir -p blob && head -c 50000000 /dev/urandom > blob/data && echo "${{ github.run_id }}" > blob/run
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: blob
          key: v4-magic-${{ github.ref_name }}
      - name: upload artifact (results proxy)
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ github.run_attempt }}
          path: blob/run
  git-apt:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4git
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config --system --get-all include.path
          time git clone -q https://github.com/runs-on/action /tmp/action && git -C /tmp/action log -1 --format=%h
          curl -s http://127.0.0.1:6871/_runs-on/git-cache | head -c 600; echo
          time sudo apt-get update -q | tail -3
          time sudo apt-get install -y -q --reinstall jq | tail -2
          curl -s http://127.0.0.1:6871/_runs-on/apt-cache | head -c 600; echo
  ecr-efs:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4ecr
    steps:
      - run: |
          echo "ECR cache: ${RUNS_ON_ECR_CACHE:-unset}"
          printf 'FROM public.ecr.aws/docker/library/alpine:3.20\nRUN echo ${{ github.run_id }} > /run-id\n' > Dockerfile
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build --cache-from type=registry,ref=$RUNS_ON_ECR_CACHE:buildcache --cache-to type=registry,ref=$RUNS_ON_ECR_CACHE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true -t local/test . 2>&1 | grep -iE "cache|exporting|error" | head -20
          findmnt -n -o TARGET,FSTYPE /mnt/efs || echo "no efs"
          date > /mnt/efs/v4-${{ github.run_id }} && ls /mnt/efs | tail -3
