name: v4-capture
on: push
jobs:
  capture:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=2cpu-linux-x64
    steps:
      - run: |
          echo "endpoint=$OTEL_EXPORTER_OTLP_ENDPOINT"
          now=$(date +%s%N)
          curl -sf -X POST "$OTEL_EXPORTER_OTLP_ENDPOINT/v1/logs" -H 'Content-Type: application/json' \
            -d '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"capture-test"}}]},"scopeLogs":[{"logRecords":[{"timeUnixNano":"'$now'","body":{"stringValue":"hello from the job"}}]}]}]}'
          echo; sleep 40
