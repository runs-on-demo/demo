name: RC verify / forged Spot interruption (#702)

# Job code on an on-demand runner tags its own instance as Spot-interrupted,
# then fails. Since #702 the tag only counts on Spot instances, so RunsOn
# must not rerun this job once the run completes (check the run's attempts a
# few minutes after it ends). Started by a push that touches
# rc-verify/v361/forged-interrupt.txt on a non-main branch.
on:
  workflow_dispatch:
  push:
    branches-ignore: [master]
    paths:
      - rc-verify/v361/forged-interrupt.txt

permissions:
  contents: read

jobs:
  forge:
    name: on-demand runner forges the interruption tag
    runs-on: runs-on=${{ github.run_id }}-forge/runner=1cpu-linux-x64/spot=false/env=demo
    steps:
      - run: |
          set -euo pipefail
          tok=$(curl -fsS -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')
          iid=$(curl -fsS -H "X-aws-ec2-metadata-token: $tok" http://169.254.169.254/latest/meta-data/instance-id)
          region=$(curl -fsS -H "X-aws-ec2-metadata-token: $tok" http://169.254.169.254/latest/meta-data/placement/region)
          life=$(curl -fsS -H "X-aws-ec2-metadata-token: $tok" http://169.254.169.254/latest/meta-data/instance-life-cycle)
          echo "instance $iid lifecycle $life"
          test "$life" = on-demand
          aws ec2 create-tags --region "$region" --resources "$iid" --tags Key=runs-on-workflow-job-interrupted,Value=true
          echo "attempt ${GITHUB_RUN_ATTEMPT}: forged the tag, now failing"
          exit 1
