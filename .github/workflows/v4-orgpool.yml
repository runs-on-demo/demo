name: v4 orgpool

on:
  push:
    branches: [v4-test/orgpool]

jobs:
  pool:
    strategy:
      matrix:
        n: [1, 2, 3]
    runs-on: runs-on/pool=v4-flex/env=dev
    steps:
      - run: echo "pool job ${{ matrix.n }} on $(hostname), up $(cut -d' ' -f1 /proc/uptime)s"
  flex-no-run-id:
    runs-on: runs-on/runner=2cpu-linux-x64/env=v4dev
    steps:
      - run: echo "flex job on $(hostname)"
