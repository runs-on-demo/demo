name: v4 superci docker
# Docker's max-concurrent-downloads: its default (3) vs superci's 16.
# Each job sets it, restarts Docker, then times pulls (or a PostHog build).
on:
  push:
    branches: ['v4-test/superci-docker']
  workflow_dispatch:
env:
  STACK: >-
    public.ecr.aws/supabase/postgres:15.8.1.085
    public.ecr.aws/supabase/studio:2026.09.04-sha-5a67366
    public.ecr.aws/supabase/storage-api:v1.89.4
    public.ecr.aws/supabase/realtime:v2.152.0
    public.ecr.aws/supabase/edge-runtime:v1.77.9
    public.ecr.aws/supabase/kong:2.8.1
    public.ecr.aws/supabase/logflare:1.54.4
    public.ecr.aws/supabase/postgres-meta:v0.100.0
  POSTHOG_SHA: 4fb50edb10e7958bd85139ea01dc346ca5d5c519
jobs:
  pull:
    if: false
    strategy:
      fail-fast: false
      matrix:
        mcd: [3, 16]
        arch: [x64, arm64]
        rep: [1, 2, 3, 4]
    runs-on: runs-on=${{ github.run_id }}-pull-${{ matrix.arch }}-${{ matrix.mcd }}-${{ matrix.rep }}/env=v4dev/cpu=4/family=${{ matrix.arch == 'x64' && 'm7i' || 'm7g' }}/image=ubuntu26-full-${{ matrix.arch }}
    steps:
      - name: Configure Docker
        run: |
          f=/etc/docker/daemon.json; [ -e $f ] || echo '{}' | sudo tee $f >/dev/null
          echo "before: $(sudo cat $f)"
          sudo jq '.["max-concurrent-downloads"]=${{ matrix.mcd }}' $f | sudo tee $f.n >/dev/null && sudo mv $f.n $f
          sudo systemctl restart docker
          docker info --format '{{.ServerVersion}} driver={{.Driver}} {{json .DriverStatus}}'
          curl -s -m 2 http://169.254.169.254/latest/meta-data/instance-type -H "X-aws-ec2-metadata-token: $(curl -s -m 2 -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')" ; echo
      - name: One image (postgres, 48 layers)
        run: |
          s=$(date +%s.%N); docker pull -q public.ecr.aws/supabase/postgres:15.8.1.085; e=$(date +%s.%N)
          echo "single=$(echo "$e - $s" | bc)" | tee -a $GITHUB_STEP_SUMMARY
          docker system prune -af >/dev/null
      - name: Eight images at once (compose-like)
        run: |
          s=$(date +%s.%N); echo $STACK | tr ' ' '\n' | xargs -P8 -n1 docker pull -q; e=$(date +%s.%N)
          echo "stack=$(echo "$e - $s" | bc)" | tee -a $GITHUB_STEP_SUMMARY
          mkdir -p /tmp/r && echo "{\"kind\":\"pull\",\"arch\":\"${{ matrix.arch }}\",\"mcd\":${{ matrix.mcd }},\"stack\":$(echo "$e - $s" | bc)}" > /tmp/r/pull.json
          grep single= $GITHUB_STEP_SUMMARY | cut -d= -f2 | xargs -I{} jq '.single={}' /tmp/r/pull.json > /tmp/r/p && mv /tmp/r/p /tmp/r/pull-${{ matrix.arch }}-${{ matrix.mcd }}-${{ matrix.rep }}.json && rm /tmp/r/pull.json
      - uses: actions/upload-artifact@v4
        with:
          name: r-pull-${{ matrix.arch }}-${{ matrix.mcd }}-${{ matrix.rep }}
          path: /tmp/r/
  posthog:
    strategy:
      fail-fast: false
      matrix:
        mcd: [3, 16]
        rep: [1, 2, 3]
    runs-on: runs-on=${{ github.run_id }}-posthog-${{ matrix.mcd }}-${{ matrix.rep }}/env=v4dev/cpu=4/family=m7i/image=ubuntu26-full-x64/volume=100gb
    steps:
      - name: Configure Docker
        run: |
          f=/etc/docker/daemon.json; [ -e $f ] || echo '{}' | sudo tee $f >/dev/null
          echo "before: $(sudo cat $f)"
          sudo jq '.["max-concurrent-downloads"]=${{ matrix.mcd }}' $f | sudo tee $f.n >/dev/null && sudo mv $f.n $f
          sudo systemctl restart docker
          docker info --format '{{.ServerVersion}} driver={{.Driver}} {{json .DriverStatus}}'
          docker buildx version; docker buildx ls
      - name: Fetch PostHog
        run: |
          mkdir posthog && cd posthog && git init -q && git remote add origin https://github.com/PostHog/posthog
          git fetch -q --depth 1 origin $POSTHOG_SHA && git checkout -q FETCH_HEAD && du -sh .
      - name: Build PostHog
        working-directory: posthog
        run: |
          s=$(date +%s.%N)
          docker build --progress=plain -t posthog:test . > /tmp/build.log 2>&1 || { tail -50 /tmp/build.log; exit 1; }
          e=$(date +%s.%N)
          echo "build=$(echo "$e - $s" | bc)" | tee -a $GITHUB_STEP_SUMMARY
          grep -E "resolve|load metadata|extracting sha256|DONE [0-9.]+s$" /tmp/build.log | grep -E "FROM|resolve|load metadata" | head -30
          echo "== slowest steps"; grep -E "^#[0-9]+ DONE [0-9.]+s" /tmp/build.log | sort -t' ' -k3 -g -r | head -15
          mkdir -p /tmp/r && echo "{\"kind\":\"posthog\",\"mcd\":${{ matrix.mcd }},\"build\":$(echo "$e - $s" | bc)}" > /tmp/r/posthog-${{ matrix.mcd }}-${{ matrix.rep }}.json
          cp /tmp/build.log /tmp/r/build-${{ matrix.mcd }}-${{ matrix.rep }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-posthog-${{ matrix.mcd }}-${{ matrix.rep }}
          path: /tmp/r/
