name: v4 host setup

on:
  push:
    branches: ['v4-test/setup*']

jobs:
  setup:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4setup
    steps:
      - run: |
          env | grep -E '^RUNS_ON_|^FROM_PREINSTALL' | sort
          echo "PATH has preinstall bin: $(echo $PATH | grep -c /opt/preinstall-bin)"
          cat /tmp/preinstall-ran 2>/dev/null || echo "no preinstall marker"
          echo "ssh: $(systemctl is-active ssh) keys: $(wc -l < ~/.ssh/authorized_keys 2>/dev/null || echo 0)"
          docker run --rm hello-world >/dev/null && echo "docker ok"
  fail:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4fail
    steps:
      - run: echo "must not run"
  debug:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4arm/debug=true
    steps:
      - run: echo "must wait for the lock"
