name: v4 launch options

on:
  push:
    branches: ['v4-test/launch*']

jobs:
  volume:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4arm/volume=60gb:gp3:4000iops:250mbs
    steps: &steps
      - run: |
          T=$(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')
          md() { curl -s -o /dev/null -w "%{http_code}" -H "X-aws-ec2-metadata-token: $T" "http://169.254.169.254/latest/meta-data/$1"; echo; }
          get() { curl -s -H "X-aws-ec2-metadata-token: $T" "http://169.254.169.254/latest/meta-data/$1"; echo; }
          echo "instance $(get instance-id) $(get instance-type) $(get instance-life-cycle)"
          echo "public-ipv4 status: $(md public-ipv4)"
          df -h / | tail -1
          ls -l /dev/kvm 2>&1 || true
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
  tags:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4tags
    steps: *steps
  nested:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/family=c7i/cpu=2/image=ubuntu24-full-x64/nested-virt=true
    steps: *steps
  private:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4arm/private=true
    steps: *steps
