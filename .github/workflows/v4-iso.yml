# v4 cache isolation test: each branch reads its own and the default
# branch's entries only.
name: v4 cache isolation

on:
  push:
    branches: ['v4-test/iso*']

jobs:
  magic-cache:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4cache
    steps:
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: blob
          key: v4-iso-shared-key
      - run: |
          echo "branch ${{ github.ref_name }}: cache hit '${{ steps.restore.outputs.cache-hit }}'"
          [ -f blob/from ] && echo "restored an entry written by: $(cat blob/from)"
          mkdir -p blob && echo "${{ github.ref_name }} run ${{ github.run_id }}" > blob/from
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: blob
          key: v4-iso-shared-key
      - name: instance role cannot reach scoped entries
        run: |
          b="$RUNS_ON_S3_BUCKET_CACHE"
          aws s3 ls "s3://$b/scoped-cache/" 2>&1 | tail -1 | cut -c1-160
          aws s3 ls "s3://$b/scoped-cache/runs-on-demo/demo/" 2>&1 | tail -1 | cut -c1-160
          aws s3api list-objects-v2 --bucket "$b" --prefix cache/git/v1/ --max-items 1 --query 'Contents[0].Key' --output text 2>&1 | tail -1 | cut -c1-160
      - name: broker refuses a forged token
        run: |
          fn="$(sudo cat /proc/$(pgrep -f sandboxd | head -1)/environ 2>/dev/null | tr '\0' '\n' | grep -c RUNS_ON_CACHE_BROKER || true)"
          echo "sandboxd has the broker setting: $fn"
          sudo journalctl -u runs-on-sandboxd -o cat | grep -iE 'broker|magic-cache|scoped' | cut -c1-240 | tail -8
  git-cache:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4git
    steps:
      - uses: actions/checkout@v4
      - run: |
          time git clone -q https://github.com/runs-on-demo/demo /tmp/self && git -C /tmp/self log -1 --format=%h
          time git clone -q https://github.com/runs-on/action /tmp/other && git -C /tmp/other log -1 --format=%h
          curl -s http://127.0.0.1:6871/_runs-on/git-cache | head -c 800; echo
          sudo journalctl -u runs-on-sandboxd -o cat | grep -iE 'git-cache|broker|scope' | cut -c1-240 | tail -10
