name: v4-alloc
on: push
jobs:
  exact-od:
    strategy:
      matrix:
        n: [1, 2, 3, 4]
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/family=m7a.large+m7i.large/image=ubuntu24-full-x64/spot=false
    steps:
      - run: curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone || true; echo
  pattern-od:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/family=m7a+c7a/cpu=2/image=ubuntu24-full-x64/spot=false
    steps:
      - run: echo ok
  cop:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/family=c7a.large+m7a.large/image=ubuntu24-full-x64/spot=cop
    steps:
      - run: echo ok
