name: v4 hosts macOS images

on:
  workflow_dispatch:
  push:
    branches: [v4-test/hosts]
    paths:
      - .github/workflows/v4-hosts-mac-images.yml

jobs:
  # A guest from each macOS image: the RunsOn-built one, and Cirrus Labs'
  # Xcode image that hostd prepares itself.
  tools:
    strategy:
      fail-fast: false
      matrix:
        pool: [v4-dev-hosts-mac, v4-dev-hosts-xcode]
    runs-on: runs-on/fleet=${{ matrix.pool }}/env=dev
    steps:
      - uses: actions/checkout@v4
      - name: Image
        run: |
          echo "runner $RUNNER_NAME as $(whoami), home $HOME, at $(date -u +%T)"
          sw_vers
          sudo -n true && echo "passwordless sudo"
          cat /var/db/runs-on/prepared
          ls -l /Users/runner | head -3
          df -h / | tail -1
      - name: Xcode and tools
        run: |
          xcode-select -p || true
          xcodebuild -version || true
          swift --version || true
          brew --version || true
          for t in git gh jq node python3 ruby; do printf '%s: ' $t; command -v $t || echo missing; done
      - name: Xcode build and simulators
        if: matrix.pool == 'v4-dev-hosts-xcode'
        run: |
          xcrun simctl list runtimes | head -5
          mkdir -p /tmp/app && cd /tmp/app
          swift package init --type library --name Lib >/dev/null
          time xcodebuild -scheme Lib -destination 'platform=macOS' build 2>&1 | tail -3
      - name: Build a Swift package
        run: |
          mkdir -p /tmp/hello && cd /tmp/hello
          swift package init --type executable --name hello >/dev/null
          swift build 2>&1 | tail -2
          .build/debug/hello
