name: v4 ubuntu26-minimal
on:
  push:
    branches: [v4-test/prestart]
jobs:
  minimal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, ami: ami-0e9c9c4cea8fd12fb }
          - { arch: arm64, ami: ami-0e77fb8496f1774c4 }
    runs-on: runs-on=${{ github.run_id }}-min-${{ matrix.arch }}/env=v4dev/runner=2cpu-linux-${{ matrix.arch }}/ami=${{ matrix.ami }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          uname -m
          df -h / | tail -1
          sudo true && echo sudo ok
          docker run --rm hello-world | head -2
