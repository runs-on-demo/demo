name: v4 first-build wait
on:
  push:
    branches: [v4-test/prestart]
jobs:
  first-build:
    runs-on: runs-on=${{ github.run_id }}-waittest3/env=v4dev/family=microvm/image=waittest3
    steps:
      - run: |
          cat /etc/os-release | head -2
          command -v jq && jq --version
          echo "queued at ${{ github.event.head_commit.timestamp }}, running at $(date -u +%FT%TZ)"
