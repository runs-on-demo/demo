name: v4 MicroVM e2e
on:
  push:
    branches: [v4-test/prestart]
jobs:
  microvm:
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
        rep: [1, 2, 3]
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.size }}-${{ matrix.rep }}/env=v4dev/family=microvm${{ matrix.size == 'large' && '/cpu=4' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Host
        run: |
          nproc; free -g | head -2; df -h / | tail -1
          echo "work: $GITHUB_WORKSPACE"
          ls /run/runs-on-hooks/ || true
          test -f /run/runs-on-hooks/ready && echo setup ready
