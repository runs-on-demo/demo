name: v4 MicroVM runner files
on:
  push:
    branches: [v4-test/prestart]
jobs:
  microvm:
    strategy:
      fail-fast: false
      matrix:
        rep: [1]
    runs-on: runs-on=${{ github.run_id }}-microvm-${{ matrix.rep }}/env=v4dev/family=microvm
    steps:
      - run: |
          for n in Runner.Listener Runner.Worker; do p=$(pgrep -f $n | head -1); awk '$6 ~ /^\// {print $6}' /proc/$p/maps | sort -u > /tmp/m.$n; echo "$n: $(wc -l < /tmp/m.$n) files, $(xargs -a /tmp/m.$n du -cbL | tail -1)"; grep -c '^/home/runner' /tmp/m.$n; done
          sort -u /tmp/m.* > /tmp/all; echo "union: $(wc -l < /tmp/all) files, $(xargs -a /tmp/all du -cbL | tail -1)"
          grep '^/home/runner' /tmp/all | xargs du -cbL | tail -1
          grep -v '^/home/runner' /tmp/all | xargs du -bL | sort -rn | head -8
          xargs -a /tmp/all du -bL | sort -rn | head -15
          ls /home/runner/bin | wc -l; du -sb /home/runner/bin/*.dll | sort -rn | head -5
