name: v4 MicroVM sudo check
on:
  push:
    branches: [v4-test/prestart]
jobs:
  microvm:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    runs-on: runs-on=${{ github.run_id }}-microvm-${{ matrix.rep }}/env=v4dev/family=microvm
    steps:
      - run: |
          for p in 1 $(pgrep -x sandboxd) $(pgrep -f Runner.Listener | head -1) $PPID $$; do printf '%s %s ' $p "$(cat /proc/$p/comm 2>/dev/null)"; grep -E 'NoNewPrivs|^Uid' /proc/$p/status 2>/dev/null | tr '\n\t' '  '; echo; done
          ps -eo pid,ppid,user,comm | head -25
          ls -l /usr/bin/sudo; mount | grep -E ' / | /usr' | head
          sudo -n true && echo "sudo ok" || { echo "sudo FAILED"; exit 1; }
