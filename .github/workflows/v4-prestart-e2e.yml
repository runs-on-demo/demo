name: v4 check after early assignment removal
on:
  push:
    branches: [v4-test/prestart]
jobs:
  ec2:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        rep: [1, 2, 3]
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.arch }}-${{ matrix.rep }}/env=v4dev/runner=2cpu-linux-${{ matrix.arch }}/image=ubuntu26-full-${{ matrix.arch }}/extras=s3-cache
    steps:
      - uses: actions/checkout@v4
      - run: echo "cache url: ${ACTIONS_CACHE_URL:-none}"; docker run --rm hello-world | head -2
  microvm:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4]
    runs-on: runs-on=${{ github.run_id }}-microvm-${{ matrix.rep }}/env=v4dev/family=microvm
    steps:
      - uses: actions/checkout@v4
      - run: nproc; echo "work: $GITHUB_WORKSPACE"
