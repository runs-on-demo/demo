name: v4 start time without STS
on:
  push:
    branches: [v4-test/prestart]
jobs:
  ec2:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        rep: [1, 2, 3, 4]
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.arch }}-${{ matrix.rep }}/env=v4dev/runner=2cpu-linux-${{ matrix.arch }}/image=ubuntu26-full-${{ matrix.arch }}/extras=s3-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: probe
          key: sts-probe-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: |
          mkdir -p probe && date > probe/at
          docker run --rm hello-world | head -2
  microvm:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: runs-on=${{ github.run_id }}-microvm-${{ matrix.rep }}/env=v4dev/family=microvm
    steps:
      - uses: actions/checkout@v4
      - run: |
          nproc
          sudo -n true && echo "sudo ok"
          id
          docker run --rm hello-world | head -2
