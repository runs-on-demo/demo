name: v4 nitro asg

on:
  push:
    branches: [v4-test/nitro-asg]
    paths:
      - .github/workflows/v4-nitro-asg.yml

# run: 1
# Pool nitro-asg of stack runs-on-v4-dev: Nitro hosts of an Auto Scaling
# group (m8i.2xlarge, 6 guests of 2 vCPUs and 4 GiB each), overflow to an EC2
# runner. The commit message says how many jobs and for how long:
# [n=14] [sleep=600].
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      sleep: ${{ steps.m.outputs.sleep }}
    steps:
      - id: m
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          n=$(grep -oP '\[n=\K[0-9]+' <<<"$MSG" || echo 1)
          s=$(grep -oP '\[sleep=\K[0-9]+' <<<"$MSG" || echo 60)
          echo "matrix=$(seq -s, 1 "$n" | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"
          echo "sleep=$s" >> "$GITHUB_OUTPUT"
  hold:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: runs-on/fleet=nitro-asg/env=dev
    steps:
      - name: Hold a slot
        run: |
          echo "WHERE $RUNS_ON_INSTANCE_ID ($RUNS_ON_INSTANCE_TYPE) at $(date -u +%T) nproc=$(nproc)"
          # Every job measures in the same 20 seconds: one thread, then two.
          now=$(date +%s); t=$(( (now/60+1)*60 )); [ $((t-now)) -lt 35 ] && t=$((t+60)); sleep $((t-now))
          c1=$(openssl speed -seconds 10 -bytes 16384 -evp sha256 2>/dev/null | tail -1 | awk '{print $NF}')
          c2=$(openssl speed -multi 2 -seconds 10 -bytes 16384 -evp sha256 2>/dev/null | tail -1 | awk '{print $NF}')
          echo "${RUNS_ON_INSTANCE_ID%%.*} $RUNS_ON_INSTANCE_TYPE one=$c1 two=$c2 at=$t" > r-${{ matrix.n }}.txt
          sleep ${{ needs.plan.outputs.sleep }}
          docker run --rm alpine:3.20 echo docker ok
          echo "DONE $RUNS_ON_INSTANCE_ID at $(date -u +%T)"
      - uses: actions/upload-artifact@v4
        with:
          name: r-${{ matrix.n }}
          path: r-${{ matrix.n }}.txt
  report:
    needs: hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sort r-*.txt
