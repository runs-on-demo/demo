name: v4 boot profile
on:
  push:
    branches: [v4-test/boot-profile]
  workflow_dispatch:
jobs:
  growpart:
    strategy:
      matrix:
        arch: [arm64]
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.arch }}/env=v4dev/runner=2cpu-linux-${{ matrix.arch }}/image=ubuntu26-full-${{ matrix.arch }}
    steps:
      - name: Grow a GPT partition after the disk grew, with sfdisk
        run: |
          set -x
          f=$(mktemp); truncate -s 1536M $f
          printf 'label: gpt\nfirst-lba: 2048\nsize=1G, type=linux\n' | sudo sfdisk -q $f
          truncate -s 4G $f
          dev=$(sudo losetup -P -f --show $f); lsblk $dev
          sudo sfdisk --verify $dev || true
          time (echo ', +' | sudo sfdisk --force -q --no-reread --no-tell-kernel -N 1 $dev; sudo partx -u -n 1 $dev)
          sudo sfdisk --verify $dev; sudo sfdisk -d $dev; lsblk $dev
          sudo mkfs.ext4 -q ${dev}p1 && echo mkfs-ok
          sudo losetup -d $dev
