name: v4 boot profile
on:
  push:
    branches: [v4-test/boot-profile]
  workflow_dispatch:
jobs:
  growpart:
    strategy:
      matrix:
        arch: [arm64]
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.arch }}/env=v4dev/runner=2cpu-linux-${{ matrix.arch }}/image=ubuntu26-full-${{ matrix.arch }}
    steps:
      - name: Time growpart on a loop device
        run: |
          set -x
          which growpart sfdisk partx udevadm
          head -40 $(which growpart) | grep -i version || true
          sudo journalctl -b -u rolaunch -o short-monotonic --no-pager | grep -E "resize|growpart" | cut -c1-200
          f=$(mktemp); truncate -s 4G $f
          printf 'label: gpt\nsize=1G, type=linux\n' | sudo sfdisk -q $f
          dev=$(sudo losetup -P -f --show $f); lsblk $dev
          sudo bash -c "PS4='+ \$EPOCHREALTIME '; time bash -x $(which growpart) $dev 1" 2>&1 | awk '{print}' | grep -E '^\+ [0-9]|real|CHANGED' | cut -c1-160 | head -120
          sudo losetup -d $dev
          truncate -s 4G $f.2; printf 'label: gpt\nsize=1G, type=linux\n' | sudo sfdisk -q $f.2
          dev=$(sudo losetup -P -f --show $f.2)
          time (echo ', +' | sudo sfdisk -q --no-reread --no-tell-kernel -N 1 $dev && sudo partx -u -n 1 $dev)
          lsblk $dev
          sudo losetup -d $dev
