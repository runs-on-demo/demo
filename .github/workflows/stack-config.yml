name: v4 etc-environment

on:
  push:
    branches: ['v4-test/stack-config']

jobs:
  env:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu24-full-x64, ubuntu26-full-x64]
    runs-on: runs-on=${{ github.run_id }}/env=dev/cpu=2/family=m7i+m7a/image=${{ matrix.image }}
    steps:
      - name: /etc/environment in the job
        run: |
          echo "names in /etc/environment: $(cut -d= -f1 /etc/environment | tr '\n' ' ')"
          missing=""
          while IFS='=' read -r k _; do
            case "$k" in ''|\#*|PATH) continue;; esac
            [ -n "${!k+x}" ] || missing="$missing $k"
          done < /etc/environment
          echo "ImageOS=${ImageOS:-unset} JAVA_HOME=${JAVA_HOME:-unset}"
          echo "missing from the job's env:${missing:- none}"
          echo "PATH=$PATH"
          echo "/etc/environment PATH=$(grep '^PATH=' /etc/environment | cut -c1-300)"
          [ -z "$missing" ]
