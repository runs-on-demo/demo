name: v4 host pool

on:
  push:
    branches: ['v4-test/stack-config']

jobs:
  hosts:
    strategy:
      fail-fast: false
      matrix:
        pool: [v4-dev-hosts-ec2]
        n: [1, 2]
    runs-on: runs-on/fleet=${{ matrix.pool }}/env=dev
    steps:
      - uses: actions/checkout@v4
      - name: on a host guest of the pool
        run: |
          echo "runner=$RUNS_ON_RUNNER_NAME instance=$RUNS_ON_INSTANCE_ID pool=$RUNS_ON_POOL_NAME version=$RUNS_ON_VERSION"
          echo "kernel=$(uname -r) cpus=$(nproc) mem=$(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo)MiB container=$([ -f /.dockerenv ] && echo yes || echo no)"
          git log --oneline -1
          case "$RUNS_ON_INSTANCE_ID" in host-*) ;; *) echo "not a host guest"; exit 1;; esac
          [ "$RUNS_ON_POOL_NAME" = "${{ matrix.pool }}" ]
