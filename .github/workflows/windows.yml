name: v4 windows
on: push
jobs:
  sticky:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/family=m7a/cpu=2/image=windows22-full-x64/sticky=10gb/extras=otel
    steps:
      - run: |
          $ErrorActionPreference = 'Continue'
          "::notice title=env::dir=$env:RUNS_ON_STICKYDISK_DIR ready=$env:RUNS_ON_STICKYDISK_READY_FILE unavailable=$env:RUNS_ON_STICKYDISK_UNAVAILABLE_FILE name=$env:RUNS_ON_STICKYDISK_NAME otlp=$env:OTEL_EXPORTER_OTLP_ENDPOINT"
          trap { "::error title=step::$($_.Exception.Message) at $($_.InvocationInfo.ScriptLineNumber)"; break }
          $deadline = (Get-Date).AddMinutes(10)
          while (-not (Test-Path $env:RUNS_ON_STICKYDISK_READY_FILE)) {
            if (Test-Path $env:RUNS_ON_STICKYDISK_UNAVAILABLE_FILE) {
              $ErrorActionPreference = 'Continue'
              Get-Disk | ForEach-Object { "::warning title=disk $($_.Number)::serial=$($_.SerialNumber) style=$($_.PartitionStyle) offline=$($_.IsOffline) ro=$($_.IsReadOnly) status=$($_.OperationalStatus) size=$($_.Size)" }
              $d = Get-Disk | Where-Object { $_.SerialNumber -like 'vol*' -and $_.Number -ne 0 } | Select-Object -First 1
              if ($d) {
                $n = $d.Number
                foreach ($c in @(
                  { if ((Get-Disk -Number $n).IsOffline) { Set-Disk -Number $n -IsOffline $false } },
                  { if ((Get-Disk -Number $n).IsReadOnly) { Set-Disk -Number $n -IsReadOnly $false } },
                  { if ((Get-Disk -Number $n).PartitionStyle -eq 'RAW') { Initialize-Disk -Number $n -PartitionStyle GPT | Out-Null } },
                  { if (-not (Get-Partition -DiskNumber $n -ErrorAction SilentlyContinue | Where-Object { $_.Type -eq 'Basic' })) { New-Partition -DiskNumber $n -UseMaximumSize -AssignDriveLetter:$false | Format-Volume -FileSystem NTFS -NewFileSystemLabel stickydisk -Confirm:$false | Out-Null } },
                  { Get-Partition -DiskNumber $n | ForEach-Object { "::warning title=part::$($_.PartitionNumber) type=$($_.Type) size=$($_.Size) paths=$($_.AccessPaths -join ';')" } }
                )) { try { & $c -ErrorAction Stop } catch { "::error title=diag::$c => $($_.Exception.Message)" } }
              }
              throw ("unavailable: " + (Get-Content -Raw $env:RUNS_ON_STICKYDISK_UNAVAILABLE_FILE))
            }
            if ((Get-Date) -gt $deadline) { throw 'no sticky disk after 10 min' }
            Start-Sleep -Seconds 1
          }
          $m = Join-Path $env:RUNS_ON_STICKYDISK_DIR 'marker.txt'
          if (Test-Path $m) { "::notice title=sticky::restored marker: " + (Get-Content -Raw $m).Trim() } else { '::notice title=sticky::no marker: blank disk' }
          $v = Get-Volume -FilePath $env:RUNS_ON_STICKYDISK_DIR
          "::notice title=volume::$($v.FileSystemLabel) $($v.FileSystem) size=$($v.Size) free=$($v.SizeRemaining)"
          "run ${{ github.run_id }} at $(Get-Date -Format o)" | Out-File -FilePath $m -Encoding utf8
        shell: pwsh
      - run: |
          "otlp=$env:OTEL_EXPORTER_OTLP_ENDPOINT completed-hook=$env:ACTIONS_RUNNER_HOOK_JOB_COMPLETED"
          if (-not $env:OTEL_EXPORTER_OTLP_ENDPOINT) { throw 'no OTLP endpoint' }
          $r = Invoke-WebRequest -UseBasicParsing -Method Post -ContentType 'application/json' -Body '{"resourceSpans":[]}' -Uri "$env:OTEL_EXPORTER_OTLP_ENDPOINT/v1/traces"
          "::notice title=otlp::local OTLP receiver: $($r.StatusCode)"
          1..3 | ForEach-Object { $x = 0; 1..2000000 | ForEach-Object { $x += $_ } }
        shell: pwsh
