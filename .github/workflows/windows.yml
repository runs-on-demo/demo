name: v4 windows
on: push
jobs:
  windows:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/family=m7a/cpu=2/image=windows22-full-x64
    steps:
      - run: |
          Write-Host "Hello from $env:COMPUTERNAME"
          [System.Environment]::OSVersion.VersionString
          Get-ChildItem env: | Where-Object { $_.Name -like 'RUNS_ON_*' } | Select-Object Name
          Get-PSDrive C | Format-Table Name,Used,Free -AutoSize | Out-String; "RUNNER_TOOL_CACHE=$env:RUNNER_TOOL_CACHE"
        shell: pwsh
