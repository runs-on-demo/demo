name: v4 windows

# C: at boot: the image's size is left alone, a larger volume= is grown into.
on:
  push:
    branches: [v4-test/windows]

jobs:
  root:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: windows25-full-x64, volume: "", want: 100}
          - {image: windows25-full-x64, volume: "/volume=150gb", want: 150}
          - {image: windows22-full-x64, volume: "", want: 50}
          - {image: windows22-full-x64, volume: "/volume=80gb", want: 80}
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/family=m7a/cpu=2/image=${{ matrix.image }}${{ matrix.volume }}
    steps:
      - shell: pwsh
        run: |
          $p = Get-Partition -DriveLetter C
          $d = Get-Disk -Number $p.DiskNumber
          $gib = [math]::Round($p.Size / 1GB)
          "::notice title=root ${{ matrix.image }}${{ matrix.volume }}::C: is $gib GiB on a disk of $([math]::Round($d.Size / 1GB)) GiB, want ${{ matrix.want }}"
          if ([math]::Abs($gib - ${{ matrix.want }}) -gt 1) { throw "C: is $gib GiB, want ${{ matrix.want }}" }
