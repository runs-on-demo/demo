name: v4 dr test

# Throwaway: jobs for the v4 fallback runner fix test (stack
# runs-on-v4-fbt, env fbt). One push is one run.
on:
  push:
    branches: [v4-test/dr]

jobs:
  pool:
    runs-on: runs-on/fleet=fbpool/env=fbt
    timeout-minutes: 30
    steps:
      - run: echo "pool job on $RUNS_ON_INSTANCE_ID in $RUNS_ON_AWS_REGION ($RUNS_ON_STACK_NAME, pool $RUNS_ON_POOL_NAME)"
