name: v4 sticky

on:
  push:
    branches: ['v4-test/sticky*']

jobs:
  webhook:
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4arm/sticky=wh:10gb
    steps: &steps
      - run: |
          d=/mnt/runs-on/stickydisk
          ls /runs-on/ | grep -i sticky || echo "no sticky marker"
          env | grep -i stickydisk || true
          mountpoint "$d" && df -h "$d" | tail -1
          n=$(cat "$d/count" 2>/dev/null || echo 0)
          echo "previous count: $n (branch ${GITHUB_REF_NAME})"
          echo $((n+1)) > "$d/count"
          echo "run ${GITHUB_RUN_NUMBER} on $(hostname)" >> "$d/history"
          cat "$d/history"
  pool:
    runs-on: v4-dev-sticky
    steps: *steps
