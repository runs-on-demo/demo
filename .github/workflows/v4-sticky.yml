name: v4 sticky

on:
  push:
    branches: ['v4-test/sticky*']

jobs:
  webhook:
    strategy:
      matrix:
        n: [1]
    runs-on: runs-on=${{ github.run_id }}/env=v4dev/runner=v4arm/sticky=wh:10gb
    steps: &steps
      - run: |
          d=/mnt/runs-on/stickydisk
          # As runs-on/action does: the disk may follow the job's start.
          for i in $(seq 120); do [ -e /runs-on/stickydisk.ready ] || [ -e /runs-on/stickydisk.unavailable ] && break; sleep 1; done
          echo "waited ${i}s"; ls /runs-on/ | grep -i sticky || echo "no sticky marker"
          cat /runs-on/stickydisk.unavailable 2>/dev/null || true
          env | grep -i stickydisk || true
          mountpoint "$d" && df -h "$d" | tail -1
          n=$(cat "$d/count" 2>/dev/null || echo 0)
          echo "previous count: $n (branch ${GITHUB_REF_NAME})"
          echo $((n+1)) > "$d/count"
          echo "run ${GITHUB_RUN_NUMBER} on $(hostname)" >> "$d/history"
          cat "$d/history"
          sleep 5
  pool:
    strategy:
      matrix:
        n: [1]
    runs-on: v4-dev-sticky
    steps: *steps
