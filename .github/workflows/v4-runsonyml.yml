name: v4 runs-on.yml

on:
  push:
    branches: ['v4-test/runsonyml*']

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        labels:
          - env=v4dev
          - env=v4dev/runner=v4arm
          - env=v4dev/runner=1cpu-linux-x64
          - env=v4dev/family=c8g/cpu=2/image=ubuntu24-full-arm64/spot=false
        n: [1, 2]
    runs-on: runs-on=${{ github.run_id }}/${{ matrix.labels }}
    steps:
      - run: |
          T=$(curl -s -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds: 60" http://169.254.169.254/latest/api/token)
          md() { curl -s -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/$1; }
          echo "labels=${{ matrix.labels }} arch=$(uname -m) type=$(md instance-type) ami=$(md ami-id) lifecycle=$(md instance-life-cycle)"
